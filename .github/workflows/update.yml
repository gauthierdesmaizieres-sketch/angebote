name: Aktionen aktualisieren

on:
  schedule:
    # ALDI and Lidl start new promotions on Monday and Thursday, Migros on Thursday:
    # 04:00 UTC = 05:00/06:00 in Switzerland.
    - cron: "0 4 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-offers
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape
        # Migros needs a headed browser: xvfb-run gives it a virtual display.
        run: xvfb-run -a python -m scraper.run

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/offers.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Aktionen aktualisiert $(date -u +%F)"
          git push
